# Nginx config restored from /rom with nrvous.io TLS certs and moonraker 7126 fix

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server — only serves UI, proxies API directly
server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

    root /usr/share/fluidd;
    index index.html;
    client_max_body_size 0;
    proxy_request_buffering off;

    # UI fallback (served from disk)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API routes -> moonraker (proxied directly, not redirected)
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }

    # Websocket -> moonraker
    location = /websocket {
        proxy_pass http://moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Camera — go2rtc replaced mjpgstreamer
    location /webcam/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webcam2/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /webcam3/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /webcam4/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}

# HTTPS server — same routes but with TLS (for remote/cloud access)
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/conf.d/nrvous.io.crt;
    ssl_certificate_key /etc/nginx/conf.d/nrvous.io.key;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

    root /usr/share/fluidd;
    index index.html;
    client_max_body_size 0;
    proxy_request_buffering off;

    # UI fallback (served from disk over TLS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API routes -> moonraker (proxied directly, not redirected)
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }

    # Websocket -> moonraker
    location = /websocket {
        proxy_pass http://moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Camera — go2rtc replaced mjpgstreamer
    location /webcam/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webcam2/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /webcam3/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /webcam4/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}

# Upstreams
upstream moonraker {
    ip_hash;
    server 127.0.0.1:7126;
}

upstream go2rtc {
    ip_hash;
    server 127.0.0.1:1984;
}
