# Elastic Common Schema (ECS) compliant JSON log formats for nginx.
# Include this in the http {} block.

log_format ecs_access escape=json '{"@timestamp":"$time_iso8601","ecs.version":"8.11.0","event.dataset":"nginx.access","event.category":["web"],"event.kind":"event","event.outcome":"$status","event.created":"$time_iso8601","log.level":"info","source.ip":"$remote_addr","source.port":"$remote_port","destination.ip":"$server_addr","destination.port":"$server_port","http.request.method":"$request_method","http.request.body.bytes":"$request_length","http.response.status_code":"$status","http.response.bytes":"$bytes_sent","http.response.body.bytes":"$body_bytes_sent","http.version":"$server_protocol","url.original":"$request_uri","url.path":"$uri","url.query":"$query_string","url.domain":"$host","user_agent.original":"$http_user_agent","http.request.referrer":"$http_referer","nginx.request_time":"$request_time","nginx.upstream_response_time":"$upstream_response_time","nginx.upstream_addr":"$upstream_addr","nginx.upstream_status":"$upstream_status","nginx.server_name":"$server_name","nginx.connection_id":"$connection","nginx.connection_requests":"$connection_requests"}';

log_format plain_access '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Note: nginx error_log format is not configurable, so we keep plain text
# error logging. Access log format is selected by the main nginx config
# (ecs_access by default; set to plain_access for normal logging).
