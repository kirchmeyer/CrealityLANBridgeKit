# Compatibility nginx template for Creality desktop-app routes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $arg_src $compat_stream_source {
    default $arg_src;
    webrtc webcam;
    '' webcam;
}

server {
    listen 81;
    server_name _;

    location = /protocal.csp { proxy_pass http://127.0.0.1:9001; }
    location = /machine/info { proxy_pass http://127.0.0.1:9001; }
}

server {
    listen 80 default_server;
    server_name _;

    location = /status { proxy_pass http://127.0.0.1:9001; }

# NOTE: SSL (port 443) was previously on this block but required nrvous.io.crt which is missing on stock printers.
# Port 80 alone works for LAN discovery and doesn't need SSL certs.
    location = /info { proxy_pass http://127.0.0.1:9001; }
    location = /protocal.csp { proxy_pass http://127.0.0.1:9001; }
    location = /machine/info { proxy_pass http://127.0.0.1:9001; }
    location = /machine/system_info { proxy_pass http://127.0.0.1:9001; }
    location = /machine/multi_machine { proxy_pass http://127.0.0.1:9001; }
    location = /printer/objects/query { proxy_pass http://127.0.0.1:9001; }
    location = /printer/print/start { proxy_pass http://127.0.0.1:9001; }
    location = /api/cxy/v3/print/record/detail { proxy_pass http://127.0.0.1:9001; }
    location = /api/cxy/v3/print/record/list { proxy_pass http://127.0.0.1:9001; }
    location = /api/cxy/v2/device/uploadVideos { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/devices/getDeviceCount { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/devices/getDevices { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/devices/getDeviceDetail { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/devices/pollState { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/addSingleTask { proxy_pass http://127.0.0.1:9001; }
    location = /api/rest/print/cluster/devices/edit { proxy_pass http://127.0.0.1:9001; }
    location = /api/cxy/v2/iotrouter/rpc { proxy_pass http://127.0.0.1:9001; }
    location ^~ /api/cxy/v2/iotrouter/rpc/ { proxy_pass http://127.0.0.1:9001; }
    location = /printer/print/cancel { proxy_pass http://127.0.0.1:9001; }
    location = /printer/print/stop { proxy_pass http://127.0.0.1:9001; }
    location = /printer/cancel { proxy_pass http://127.0.0.1:9001; }
    location = /printer/emergency_stop { proxy_pass http://127.0.0.1:9001; }
    location ^~ /api/rest/iotrouter/rpc/ { proxy_pass http://127.0.0.1:9001; }
    location = /api/v1/device/status { proxy_pass http://127.0.0.1:9001; }
    location = /cxy/v1/status { proxy_pass http://127.0.0.1:9001; }
    location = /debug/creality-probe-status { proxy_pass http://127.0.0.1:9001; }
    location = /debug/creality-probe-status/ { proxy_pass http://127.0.0.1:9001; }

    location = /server/files/upload { proxy_pass http://127.0.0.1:9001; }
    location = /upload { return 307 /upload/; }
    location /upload/ { proxy_pass http://127.0.0.1:9001; }

    location = /api/v1/streams { proxy_pass http://127.0.0.1:9001; }
    location = /api/streams { proxy_pass http://127.0.0.1:1984; }
    location = /api/stream.m3u8 {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/stream.m3u8?src=$stream_source;
    }
    location = /api/stream.ts {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/stream.ts?src=$stream_source;
    }
    location = /api/webrtc {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:1984;
    }
    location = /api/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:1984;
    }
    location = /webrtc {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:1984;
    }
    location = /live {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/stream.m3u8?src=$stream_source;
    }
    location = /api/frame.jpeg {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/frame?src=$stream_source;
    }
    location = /api/frame.jpg {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/frame?src=$stream_source;
    }
    location = /api/frame {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/frame?src=$stream_source;
    }
    location = /hls/playlist.m3u8 {
        set $stream_source $compat_stream_source;
        proxy_pass http://127.0.0.1:1984/api/stream.m3u8?src=$stream_source;
    }
    location ^~ /hls/ {
        proxy_pass http://127.0.0.1:1984;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /camera { proxy_pass http://127.0.0.1:1984; }
    location = /webcam { proxy_pass http://127.0.0.1:1984; }
    location ^~ /webcam/ { proxy_pass http://127.0.0.1:1984; }
    location = /webcam/api/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:1984/api/ws;
    }

    location = /call/webrtc_local {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ ^/(call|webrtc|live|camera|ws|call/.*) {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /websocket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:7126/websocket;
    }

    location /server/ {
        proxy_pass http://127.0.0.1:7126;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7126;
    }

    location /printer/ {
        proxy_pass http://127.0.0.1:7126;
    }

    location /machine/ {
        proxy_pass http://127.0.0.1:7126;
    }

    location / {
        root /usr/share/fluidd;
        try_files $uri $uri/ /index.html;
    }
}
