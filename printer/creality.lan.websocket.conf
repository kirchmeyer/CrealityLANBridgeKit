# Stock Creality LAN WebSocket port (9999).
# The desktop app's device manager opens ws://<printer-ip>:9999 for live status.
# Proxy those connections to lan_bridge on 127.0.0.1:9002.
server {
    listen 9999 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Fallback MJPEG stream port used by the desktop app when webrtcSupport is off.
# The app requests http://<printer-ip>:8080/?action=stream; proxy to go2rtc.
server {
    listen 8080 default_server;
    server_name _;

    location / {
        # The app requests http://<ip>:8080/?action=stream; serve the camera
        # frame directly and ignore the query string.
        rewrite ^/$ /api/frame.jpeg?src=camera break;
        proxy_pass http://127.0.0.1:1984;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
