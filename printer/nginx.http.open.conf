    # HTTP server (open mode).
    # The Creality desktop app adds printers by IP and uses plain HTTP for the
    # LAN flow, so every LAN-app endpoint is available directly on port 80.
    server {
        listen 80 default_server;
        server_name _;

        # LAN-app compatibility routes (status, info, /call/*, uploads, etc.)
        include /etc/nginx/conf.d/creality.lan.locations.conf;

        # Status page (unlikely to clash)
        location = /%STATUS_PATH% {
            return 301 /%STATUS_PATH%/;
        }
        location /%STATUS_PATH%/ {
            proxy_pass http://127.0.0.1:8765/%STATUS_PATH%/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /webcam/ {
            proxy_pass http://go2rtc/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Extra webcam aliases (from reference/nginx_stock_with_tls.conf)
        location /webcam2/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }
        location /webcam3/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }
        location /webcam4/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }

        # API routes -> moonraker (also available on HTTP for LAN clients)
        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://moonraker$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
        }

        # Websocket -> moonraker
        location = /websocket {
            proxy_pass http://moonraker/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }

    # Legacy Creality LAN server on port 81.
    # The desktop app falls back here when adding by IP and uses /protocal.csp.
    server {
        listen 81 default_server;
        server_name _;

        include /etc/nginx/conf.d/creality.lan.locations.conf;
    }
