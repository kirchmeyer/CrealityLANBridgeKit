# LAN bridge front-door config for public and local LAN access.
# Replaces the stock Creality web-server on ports 80/443.
# Combines: Fluidd UI, moonraker API, go2rtc camera, and webrtc_local_bridge.
# PROJECT_NAME=%PROJECT_NAME%
#
# Placeholders:
#   %PUBLIC_HOST%  - public hostname used by the app (e.g. printer.lan)
#   %CERT_BASENAME% - basename of cert/key files in /etc/nginx/conf.d/
#   %LAN_MODE%     - "open" serves LAN-app endpoints on plain HTTP;
#                    "proxy" closes plain HTTP and requires the local proxy.

events {
    worker_connections  1024;
}

worker_processes  1;

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/ecs-log-format.conf;
    include /etc/nginx/conf.d/creality.lan.websocket.conf;

    access_log /var/log/nginx/access.json.log %NGINX_LOG_FORMAT%;
    error_log  /var/log/nginx/error.log warn;

    # Upstreams
    upstream moonraker {
        ip_hash;
        server 127.0.0.1:7125;
    }

    upstream go2rtc {
        ip_hash;
        server 127.0.0.1:1984;
    }

    upstream webrtc_local_bridge {
        server 127.0.0.1:8000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # CORS: echo the request Origin when present so the desktop webview's
    # file:// origin is allowed; fall back to * for non-browser requests.
    map $http_origin $cors_origin {
        default $http_origin;
        ''      *;
    }
    map $http_origin $cors_creds {
        default true;
        ''      false;
    }

    # HTTP server configuration is selected by install.sh based on --lan-mode.
    #   open  - plain HTTP LAN-app endpoints are served directly on port 80/81.
    #   proxy - plain HTTP is closed; the app must use the local HTTP proxy.
    # LAN_MODE_HTTP_SERVER_PLACEHOLDER

# HTTPS server
server {
    listen 443 ssl default_server;
    server_name _;

    include /etc/nginx/conf.d/creality.lan.locations.conf;

    # Status page (unlikely to clash)
    location = /%STATUS_PATH% {
        return 301 /%STATUS_PATH%/;
    }
    location /%STATUS_PATH%/ {
        proxy_pass http://127.0.0.1:8765/%STATUS_PATH%/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ssl_certificate /etc/nginx/conf.d/%CERT_BASENAME%.crt;
    ssl_certificate_key /etc/nginx/conf.d/%CERT_BASENAME%.key;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 4;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

    root /usr/share/fluidd;
    index index.html;
    client_max_body_size 0;
    proxy_request_buffering off;

    # UI fallback (served from disk over TLS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # WebRTC bridge for Creality cloud / mobile app on HTTPS.
    location = /call/webrtc_local {
        proxy_pass http://webrtc_local_bridge/call/webrtc_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Camera — go2rtc
    location /webcam/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Extra webcam aliases (from reference/nginx_stock_with_tls.conf)
    location /webcam2/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }
    location /webcam3/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }
    location /webcam4/ { proxy_pass http://go2rtc/; proxy_http_version 1.1; proxy_set_header Host $http_host; }

    # API routes -> moonraker
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://moonraker$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }

    # Websocket -> moonraker
    location = /websocket {
        proxy_pass http://moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

# Fluidd HTTPS fallback port.
# The shipped Fluidd bundle hardcodes wss://<host>:7130/websocket when the page
# is loaded over HTTPS. Moonraker only listens on 7125, so proxy 7130 to it.
server {
    listen 7130 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/conf.d/%CERT_BASENAME%.crt;
    ssl_certificate_key /etc/nginx/conf.d/%CERT_BASENAME%.key;

    location = /websocket {
        proxy_pass http://moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Nothing else should be served on this port.
    location / {
        return 444;
    }
}
}
