# Minimal Creality desktop/mobile app compatibility locations.
# Include this inside an http {} server block (both HTTP and HTTPS).
# Proxies only the routes the stock app actually uses to lan_bridge on
# 127.0.0.1:9002. Everything else is handled by the main nginx server block
# (Moonraker / Fluidd / go2rtc).

# CORS helper: the desktop app's webview loads from file:// and uses axios to
# talk directly to the printer on the LAN.
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH" always;
add_header Access-Control-Allow-Headers "*" always;
add_header Access-Control-Allow-Credentials $cors_creds always;
add_header Access-Control-Expose-Headers "*" always;

if ($request_method = OPTIONS) {
    return 204;
}

# Discovery and status polling served by the minimal LAN bridge.
location = /status          { proxy_pass http://127.0.0.1:9002; }
location = /info            { proxy_pass http://127.0.0.1:9002; }
location = /protocal.csp    { proxy_pass http://127.0.0.1:9002; }

# WebSocket / generic call paths used by the desktop app for live status.
location ~ ^/call/ {
    proxy_pass http://127.0.0.1:9002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
}

# Moonraker multipart upload endpoint (used by some app flows directly).
location = /server/files/upload {
    proxy_pass http://moonraker$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
}
# Creality native send rewrites raw POST /upload/<file> into Moonraker multipart.
location /upload/ {
    proxy_pass http://127.0.0.1:9002;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
    client_max_body_size 200M;
}

# Live camera MJPEG stream from the RTSP-to-MJPEG server.
# go2rtc opens /dev/video0 as H264 and exposes WebRTC/RTSP. This build of
# go2rtc cannot transcode H264 -> MJPEG, so mjpeg_server transcodes the
# go2rtc RTSP feed for the Creality LAN app and Fluidd.
location /camera.mjpeg {
    proxy_pass http://127.0.0.1:8081/cam.mjpg;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 86400s;
}
location /camera.jpeg {
    # Snapshot from mjpeg_server (more reliable than asking go2rtc to
    # encode a JPEG from the H264 source).
    rewrite ^/camera.jpeg$ /cam.jpg break;
    proxy_pass http://127.0.0.1:8081;
    proxy_buffering off;
}

# Static paths for app thumbnails / records / timelapse.
location /creality/local_gcode/ {
    alias /mnt/UDISK/creality/local_gcode/;
}
location /creality/userdata/delay_image/ {
    alias /mnt/UDISK/creality/userdata/delay_image/;
}
location /printer_data/gcodes/ {
    alias /mnt/UDISK/printer_data/gcodes/;
}

# Fluidd / Mainsail real MJPEG stream alias.
location /webcam/stream.mjpg {
    proxy_pass http://127.0.0.1:8081/cam.mjpg;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 86400s;
}
# HLS endpoint for Fluidd: go2rtc produces a live HLS playlist from the
# H264 source so Fluidd can play smooth video without MJPEG transcoding.
# Falls back to go2rtc default /webcam/ location below.
# Fast snapshot for Fluidd adaptive camera mode (WebKit/Safari can't show
# multipart/x-mixed-replace inside an <img> tag). go2rtc's JPEG endpoint
# hangs on this build when asked to encode a frame from the H264 source,
# so proxy the snapshot through mjpeg_server instead. The rewrite drops
# Fluidd's cacheBust query string; mjpeg_server only needs /cam.jpg.
location /webcam/cam.jpg {
    rewrite ^/webcam/cam\.jpg$ /cam.jpg? break;
    proxy_pass http://127.0.0.1:8081;
    proxy_buffering off;
    proxy_read_timeout 10s;
}

# App download paths used by the Local Files / Records / Timelapse tabs.
location /downloads/gcode/ {
    alias /mnt/UDISK/printer_data/gcodes/;
}
location /downloads/video/ {
    alias /mnt/UDISK/creality/userdata/delay_image/video/;
}
# Thumbnails and previews for Local Files come from the native local_gcode cache.
# Timelapse covers live under delay_image/cover; the app asks for them
# via /downloads/humbnail/<id>.png when rendering the Timelapse tab.
# Nginx picks a prefix location first, so handle covers inside this block.
location /downloads/humbnail/ {
    alias /mnt/UDISK/creality/local_gcode/humbnail/;
    try_files $uri $uri/ =404;
}
# Narrower regex location for numeric timelapse cover files.
location ~ ^/downloads/humbnail/(\d+\.png)$ {
    root /mnt/UDISK/creality/userdata/delay_image/cover/;
    rewrite ^/downloads/humbnail/(\d+\.png)$ /$1 break;
}
# Fallback for original/preview images from the native local_gcode cache.
location /downloads/original/ {
    alias /mnt/UDISK/creality/local_gcode/original/;
}
