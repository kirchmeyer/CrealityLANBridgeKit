    # HTTP server (proxy mode).
    # Plain HTTP is closed for the LAN printer flow. The Creality desktop app
    # must connect through the local HTTP proxy running on the client.
    server {
        listen 80 default_server;
        server_name _;

        # Redirect all plain HTTP to HTTPS.
        return 301 https://$host$request_uri;
    }

    # Legacy Creality LAN fallback on port 81 is also closed in proxy mode.
    server {
        listen 81 default_server;
        server_name _;

        return 301 https://$host$request_uri;
    }
